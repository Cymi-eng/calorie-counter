<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Counter</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 ">

    <div class="max-w-3xl mx-auto p-6">

        <h1 class="text-4xl text-amber-600 font-bold  mb-8 ">
            Calorie Counter
        </h1>

        <!-- Form -->
        <form id="foodForm" class="bg-white p-4 rounded shadow border">

            <div class="mb-4">
                <label class="block mb-2">Food Name</label>
                <input
                    type="text"
                    id="foodName"
                    class="w-full border p-2 rounded"
                    placeholder="Enter food name"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="block mb-2">Calories</label>
                <input
                    type="number"
                    id="calories"
                    class="w-full border p-2 rounded"
                    placeholder="Enter calories"
                    required
                >
            </div>

            <button
                type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
                Add Food
            </button>

        </form>

        <!-- Total Calories -->
        <div class="bg-white p-4 rounded shadow mt-6">
            <h2 class="text-2xl font-bold">
                Total Calories:
                <span id="totalCalories">0</span>
            </h2>
        </div>

        <!-- Food List -->
        <div class="bg-white p-4 rounded shadow mt-6">
            <h2 class="text-2xl font-bold mb-4">Food Items</h2>

            <ul id="foodList" class="space-y-2"></ul>
        </div>

        <!-- Buttons -->
        <div class="mt-6 flex gap-4">

            <button
                id="fetchBtn"
                class="bg-amber-600 text-white px-4 py-2 rounded mt-2"
            >
                Fetch Sample Food
            </button>

            <button
                id="resetBtn"
                class="bg-amber-600 text-white px-4 py-2 rounded mt-2"
            >
                Reset Day
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
